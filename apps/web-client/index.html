<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/static/logo_transparent_background.ico" />
	    <link rel="manifest" href="manifest.json" />
		<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
		<meta name="theme-color" content="#000000" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<title>Scuttle</title>

		<style>
			/* direct css for no runtime imports */
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: oklch(0.145 0 0); /* equivalent to --bg-background */
				overflow: hidden;
			}

			/* shimmer loading animation */
			@keyframes load-shimmer-sweep-horizontal {
				0% {
					transform: translateX(-200%);
				}
				100% {
					transform: translateX(200%);
				}
			}
			@keyframes load-shimmer-sweep-vertical {
				0% {
					transform: translateY(-200%);
				}
				100% {
					transform: translateY(200%);
				}
			}
			
			#pwa-load-shell {
				left: 0;
				right: 0;
				top: 0;
				bottom: 0;
				width: 100%;
				height: 100;
			}

			.load-shimmer-track {
				position: fixed;
				overflow: hidden;
				pointer-events: none;
			}
			.load-shimmer-track.horizontal {
				left: 0;
				right: 0;
				width: 100%;
				height: 3px;
			}
			.load-shimmer-track.vertical {
				top: 0;
				bottom: 0;
				width: 3px;
				height: 100%;
			}

			.load-shimmer-bar {
				width: 100%;
				height: 100%;
			}
			.load-shimmer-bar.horizontal {
				background: linear-gradient(
					90deg,
					transparent 0%,
					oklch(0.72 0.19 145 / 0.8) 50%,
					transparent 100%
				);
			}
			.load-shimmer-bar.vertical {
				background: linear-gradient(
					180deg,
					transparent 0%,
					oklch(0.72 0.19 145 / 0.8) 50%,
					transparent 100%
				);
				/* animation: load-shimmer-sweep 8s linear infinite; */
			}
		</style>
	</head>
	<body>
		<div id="pwa-load-shell">
			<div class="load-shimmer-track vertical" style="left: 0px;">
				<div class="load-shimmer-bar vertical" style="animation: load-shimmer-sweep-vertical 8s linear infinite reverse;"></div>
			</div>

			<div class="load-shimmer-track horizontal" style="top: 0px;">
				<div class="load-shimmer-bar horizontal" style="animation: load-shimmer-sweep-horizontal 8s linear infinite; animation-delay: 2s;"></div>
			</div>

			<div class="load-shimmer-track vertical" style="right: 0px;">
				<div class="load-shimmer-bar vertical" style="animation: load-shimmer-sweep-vertical 8s linear infinite; animation-delay: 4s;"></div>
			</div>

			<div class="load-shimmer-track horizontal" style="bottom: 0px;">
				<div class="load-shimmer-bar horizontal" style="animation: load-shimmer-sweep-horizontal 8s linear infinite reverse; animation-delay: 6s;"></div>
			</div>
		</div>

		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
