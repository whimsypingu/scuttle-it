<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/static/logo_transparent_background.ico" />
	    <link rel="manifest" href="manifest.json" />
		<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
		<meta name="theme-color" content="#000000" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<title>Scuttle</title>

		<style>
			/* Reset zero-margin defaults */
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #0a0a0a;
				overflow: hidden;
			}

			/* Test fallback shell painted directly from SW cache */
			#root:empty,
			#root-fallback {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100vw;
				height: 100vh;
				background-color: #22c55e; /* Bright emerald green */
				color: #161b22;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				font-weight: 700;
				font-size: 1.25rem;
				letter-spacing: 0.05em;
			}
		</style>
	</head>
	<body>
		<div id="root">

			<!-- Replaced instantly once React/main.tsx executes -->
			<div id="root-fallback">
				APP SHELL CACHED
			</div>
	
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
